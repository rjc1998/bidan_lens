name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: pyinstaller --noconfirm packaging/bidan_lens.spec
      - uses: actions/upload-artifact@v4
        with:
          name: bidan-lens-windows-x64
          path: dist/bidan-lens/
